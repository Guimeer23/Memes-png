<section id="pgProfile" hidden>
  <div class="pfCard" id="pfCard"></div>
  <div style="text-align:center;margin-bottom:12px"><button class="ghost" id="pfLogout">Sair da conta</button></div>
  <div class="box" id="pfBioBox" hidden>
    <h3>📝 Bio</h3>
    <p class="mut" style="margin:4px 0 8px">Escolha uma pronta ou escreva a sua (até 80 caracteres).</p>
    <div class="row" style="margin-bottom:6px">
      <input id="pfCustom" maxlength="80" placeholder="Escreva sua bio...">
      <button class="main" id="pfSaveCustom">OK</button>
    </div>
    <div class="bioList" id="pfBioList"></div>
  </div>
  <div class="box" id="pfTitleBox" hidden>
    <h3>🎭 Título</h3>
    <p class="mut" style="margin:4px 0 8px">Escolha um título para aparecer antes do seu nome.</p>
    <div class="titleGrid" id="pfTitleList"></div>
  </div>
  <div class="box" id="pfSeloBox" hidden>
    <h3>🎖️ Selos <small id="pfSeloCount"></small></h3>
    <p class="mut" style="margin:4px 0 8px">Escolha até 3 selos para exibir no ranking.</p>
    <div class="seloGrid" id="pfSeloList"></div>
  </div>
  <div class="box" id="pfConqBox">
    <h3>🏅 Conquistas <small id="pfConqCount"></small></h3>
    <p class="mut" style="margin:4px 0 8px">Cartas secretas e de eventos que você tirou nos pacotes.</p>
    <h4 style="margin:8px 0 2px;font-size:.85rem">🔒 Secretas</h4><div class="seloGrid" id="pfConqSec"></div>
    <h4 style="margin:10px 0 2px;font-size:.85rem">🎉 Eventos</h4><div class="seloGrid" id="pfConqEv"></div>
  </div>
 </section>
