<section id="pgRank" hidden>
  <div class="box">
    <h3>🏆 Ranking <small id="rkInfo"></small></h3>
    <div class="rkMyId" id="rkMyId"></div>
    <div class="rkSearch">
      <input id="rkQ" type="search" placeholder="🔍 Buscar jogador por nome ou ID" autocomplete="off" autocapitalize="off" maxlength="40" enterkeyhint="search">
      <button class="main" id="rkQgo">Buscar</button>
    </div>
    <div id="rkRes"></div>

    <div class="rkFilters" id="rkFilters">
      <button class="ghost on" data-f="global">🌎 Global</button>
      <button class="ghost" data-f="regional" id="rkRegBtn">🇧🇷 Regional</button>
      <button class="ghost" data-f="friends">👥 Amigos</button>
      <button class="ghost" data-f="weekly">🔥 Semanal</button>
    </div>
    <div class="rkFilters" id="rkSize">
      <button class="ghost on" data-s="50">Top 50</button>
      <button class="ghost" data-s="100">Top 100</button>
    </div>
    <div id="rkMe"></div>
    <div id="rkPodium"></div>
    <div id="rkList"><p class="rkEmpty">Entre com Google para ver o ranking.</p></div>
  </div>
 </section>
